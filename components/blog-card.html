<article class="panel panel-hover blog-card">
  <div class="meta">
    <span class="badge" data-blog-category>Category</span>
    <time data-blog-date>Date</time>
    <span data-blog-read>5 min read</span>
  </div>
  <h3 data-blog-title>Title</h3>
  <p data-blog-desc>Description</p>
  <a class="card-link" data-blog-link href="#">Read article →</a>
</article>
