<section class="section-tight section" style="border-top:1px solid var(--line)">
  <div class="container">
    <div class="newsletter panel">
      <div>
        <span class="eyebrow">Updates</span>
        <h2 style="font-size:1.35rem;margin:0.55rem 0 0.4rem">Orbit AI progress</h2>
        <p>Research notes and product updates. Newsletter delivery is coming soon.</p>
      </div>
      <form data-newsletter-form novalidate>
        <label class="sr-only" for="newsletter-email">Email</label>
        <input id="newsletter-email" name="email" type="email" required placeholder="you@company.com" autocomplete="email" />
        <button class="btn btn-primary" type="submit">Notify me</button>
        <p data-newsletter-note style="flex-basis:100%;font-size:0.78rem;color:var(--text-3);margin:0"></p>
      </form>
    </div>
  </div>
</section>
