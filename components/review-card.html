<article class="panel review-card">
  <div style="display:flex;justify-content:space-between;gap:0.75rem;align-items:flex-start;flex-wrap:wrap">
    <div>
      <strong style="color:var(--text)" data-review-name>Name</strong>
      <p style="font-size:0.8rem;margin-top:0.2rem" data-review-role>Role · Company</p>
    </div>
    <span class="badge badge-verified" data-review-verified hidden>Verified</span>
  </div>
  <div class="stars" data-review-stars aria-label="Rating">★★★★★</div>
  <p data-review-body>Review text</p>
</article>
