<style>
  @media (max-width: 768px) {
    .orbit-header-links {
      display: none !important;
    }
    .orbit-header-pricing-cta {
      display: none !important;
    }
    #orbit-nav-hamburger {
      display: inline-flex !important;
    }
  }
  .orbit-header-link:hover {
    color: #F5F7FA !important;
  }
  .orbit-header-pricing-cta:hover {
    color: #F5F7FA !important;
  }
</style>

<script>
  (() => {
    const btn = document.getElementById('orbit-nav-hamburger');
    const drawer = document.getElementById('orbit-mobile-drawer');
    if (!btn || !drawer) return;

    btn.addEventListener('click', () => {
      const isExpanded = btn.getAttribute('aria-expanded') === 'true';
      btn.setAttribute('aria-expanded', !isExpanded);
      drawer.style.display = isExpanded ? 'none' : 'block';
    });

    drawer.querySelectorAll('a').forEach((link) => {
      link.addEventListener('click', () => {
        btn.setAttribute('aria-expanded', 'false');
        drawer.style.display = 'none';
      });
    });
  })();
</script>
